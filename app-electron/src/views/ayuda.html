<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SUSERCA AYUDA</title>
    <link rel="stylesheet" href="../assets/output.css" />
    <link rel="stylesheet" href="../assets/custom.css" />
    <script src="../scripts/authGuard.js" defer></script>
    <script src="../scripts/sidebar.js" defer></script>
    <script src="../scripts/header.js"></script>
  </head>

  <body class="min-h-screen bg-zinc-200 flex flex-col">
    <header
      class="fixed top-0 left-0 w-full z-50 bg-white flex flex-row gap-2 min-w-full justify-between"
    >
      <div class="flex flex-row">
        <a href="../views/dashboard.html" class="flex flex-row">
          <div>
            <img
              src="../assets/icons/general/logo.jpg"
              alt="logo SUSERCA"
              height="90"
              width="90"
              class="p-1"
            />
          </div>
          <div>
            <h1 class="text-green-800 font-bold text-5xl">SUSERCA</h1>
            <p class="text-green-800 text-xs pl-2">
              Suministros y Servicios de Occidente
            </p>
          </div>
        </a>
        <div class="flex items-center font-bold text-3xl pl-24">
          <p>Ayuda</p>
        </div>
      </div>
      <div class="flex flex-row gap-5">
        <button id="settingsicon" class="hover:cursor-pointer">
          <div class="flex items-center">
            <img
              src="../assets/icons/header/settings.png"
              alt="settings engranaje"
              height="50"
              width="50"
            />
          </div>
        </button>
        <div class="flex items-center pr-2">
          <button id="usericon" class="hover:cursor-pointer">
            <img
              src="../assets/icons/header/user.png"
              alt="user icon"
              height="50"
              width="50"
            />
          </button>
        </div>
      </div>
    </header>

    <div
      id="sidebar"
      class="fixed left-0 top-19 h-full bg-green-800 flex flex-col gap-2.5 transition-all duration-300"
    >
      <button
        type="button"
        onclick="toggleSidebar()"
        class="ml-2.5 mt-2.5 pl-1.25"
      >
        <div
          class="p-2.5 w-16 border border-white rounded-xl shadow-lg hover:border-orange-400/90 hover:bg-orange-500/90 hover:cursor-pointer transition"
        >
          <img
            src="../assets/icons/sideBar/toggle.png"
            alt="toggle icon"
            class="w-10 h-10 flex-shrink-0"
          />
        </div>
      </button>

      <button
        onclick="window.location.href='../views/dashboard.html'"
        target="_self"
        class="border-2 border-green-700 rounded-xl mx-2.5 text-white font-bold shadow-lg hover:bg-orange-500/90 hover:border-orange-400/90 hover:cursor-pointer transition"
      >
        <div class="flex flex-row items-center">
          <img
            src="../assets/icons/sideBar/dashboard.png"
            alt="dashboard icon"
            class="ml-1.25 p-1.25 h-15 w-15"
          />
          <p class="pl-5 text-2xl pr-24 sidebar-text">Dashboard</p>
        </div>
      </button>

      <button
        onclick="window.location.href='../views/inventario.html'"
        target="_self"
        class="border-2 border-green-700 rounded-xl mx-2.5 text-white font-bold shadow-lg hover:bg-orange-500/90 hover:border-orange-400/90 hover:cursor-pointer transition"
      >
        <div class="flex flex-row items-center">
          <img
            src="../assets/icons/sideBar/inventario.png"
            alt="dashboard icon"
            class="ml-1.25 p-1.25 h-15 w-15"
          />
          <p class="pl-5 text-2xl pr-24 sidebar-text">Inventario</p>
        </div>
      </button>

      <button
        onclick="window.location.href='../views/clientes.html'"
        target="_self"
        class="border-2 border-green-700 rounded-xl mx-2.5 text-white font-bold shadow-lg hover:bg-orange-500/90 hover:border-orange-400/90 hover:cursor-pointer transition"
      >
        <div class="flex flex-row items-center">
          <img
            src="../assets/icons/sideBar/clientes.png"
            alt="dashboard icon"
            class="ml-1.25 p-1.25 h-15 w-15"
          />
          <p class="pl-5 text-2xl sidebar-text">Clientes</p>
        </div>
      </button>

      <button
        onclick="window.location.href='../views/proveedores.html'"
        target="_self"
        class="border-2 border-green-700 rounded-xl mx-2.5 text-white font-bold shadow-lg hover:bg-orange-500/90 hover:border-orange-400/90 hover:cursor-pointer transition"
      >
        <div class="flex flex-row items-center">
          <img
            src="../assets/icons/sideBar/proveedores.png"
            alt="dashboard icon"
            class="ml-1.25 p-1.25 h-15 w-15"
          />
          <p class="pl-5 text-2xl pr-24 sidebar-text">Proveedores</p>
        </div>
      </button>

      <button
        onclick="window.location.href='../views/finanzas.html'"
        target="_self"
        class="border-2 border-green-700 rounded-xl mx-2.5 text-white font-bold shadow-lg hover:bg-orange-500/90 hover:border-orange-400/90 hover:cursor-pointer transition"
      >
        <div class="flex flex-row items-center">
          <img
            src="../assets/icons/sideBar/finanzas.png"
            alt="dashboard icon"
            class="ml-1.25 p-1.25 h-15 w-15"
          />
          <p class="pl-5 text-2xl pr-24 sidebar-text">Finanzas</p>
        </div>
      </button>

      <button
        onclick="showUsersWindow(localStorage.getItem('user_id'))"
        target="_self"
        class="border-2 border-green-700 rounded-xl mx-2.5 text-white font-bold shadow-lg hover:bg-orange-500/90 hover:border-orange-400/90 hover:cursor-pointer transition"
      >
        <div class="flex flex-row items-center">
          <img
            src="../assets/icons/sideBar/usuarios.png"
            alt="dashboard icon"
            class="ml-1.25 p-1.25 h-15 w-15"
          />
          <p class="pl-5 text-2xl pr-24 sidebar-text">Usuarios</p>
        </div>
      </button>

      <button
        target="_self"
        class="border-4 border-orange-500 rounded-xl mx-2.5 text-white font-bold shadow-lg hover:bg-orange-500/90 hover:border-orange-400/90 hover:cursor-pointer transition"
      >
        <div class="flex flex-row items-center">
          <img
            src="../assets/icons/sideBar/ayuda.png"
            alt="dashboard icon"
            class="ml-1.25 p-1.25 h-15 w-15"
          />
          <p class="pl-5 text-2xl pr-24 sidebar-text">Ayuda</p>
        </div>
      </button>
    </div>

    <main
      id="main-content"
      class="mt-19 h-full p-15 overflow-auto flex-1 flex transition-all duration-300 justify-center content-center"
    >
      <div
        class="bg-white w-full rounded-3xl max-w-6xl flex flex-row justify-between items-center"
      >
        <!-- Botones alineados a la izquierda, ancho fijo y texto centrado -->
        <div class="flex flex-col gap-15 pl-10 justify-center w-full">
          <button
            class="border border-black flex items-center md:text-xs lg:text-lg xl:text-xl p-2 rounded-xl hover:cursor-pointer w-full"
          >
            <img
              class="md:size-6 lg:size-8 xl:size-10 mr-5"
              src="../assets/icons/ayuda/pdf.png"
              alt="pdf"
            />
            <span class="text-center break-words flex-1"
              >Manual de Usuarios</span
            >
          </button>
          <button
            class="border border-black flex items-center md:text-xs lg:text-lg xl:text-xl p-2 rounded-xl hover:cursor-pointer w-full"
          >
            <img
              class="md:size-6 lg:size-8 xl:size-10 mr-5"
              src="../assets/icons/ayuda/pdf.png"
              alt="pdf"
            />
            <span class="text-center break-words flex-1">Acerca De</span>
          </button>
          <button
            class="border border-black flex items-center md:text-xs lg:text-lg xl:text-xl p-2 pr-8 rounded-xl hover:cursor-pointer w-full"
          >
            <img
              class="md:size-6 lg:size-8 xl:size-10 mr-5"
              src="../assets/icons/ayuda/pdf.png"
              alt="pdf"
            />
            <span class="text-center break-words flex-1"
              >Preguntas Frecuentes</span
            >
          </button>
        </div>
        <!-- Grid de imágenes alineado a la derecha -->
        <div
          class="grid grid-cols-2 grid-rows-2 gap-0.5 size-100 lg:size-125 xl:size-150 mr-12 p-5 min-w-100 lg:min-w-125 xl:min-w-150"
        >
          <!-- Imagen grande a la izquierda (ocupa dos filas) -->
          <img
            src="../assets/img/almacen-1.jpg"
            alt="Foto SUSERCA"
            class="row-span-2 col-span-1 w-full h-full object-cover rounded-l-2xl"
          />
          <!-- Imagen pequeña arriba derecha -->
          <img
            src="../assets/img/industria-1.jpeg"
            alt="Foto SUSERCA"
            class="row-span-1 col-span-1 w-full h-full object-cover rounded-tr-2xl"
          />
          <!-- Imagen pequeña abajo derecha -->
          <img
            src="../assets/img/oficina-1.jpg"
            alt="Foto SUSERCA"
            class="row-span-1 col-span-1 w-full h-full object-cover rounded-br-2xl"
          />
        </div>
      </div>

      <!--Pop up de usuario-->
      <div id="user-modal" class="absolute right-3.5 top-20 hidden">
        <div class="bg-zinc-400 rounded-xl flex flex-col gap-2 p-2 text-xl">
          <button
            class="text-white px-4 py-2 rounded-full bg-green-800 border border-green-700 hover:bg-orange-400 hover:cursor-pointer transition"
          >
            Informacion de Usuario
          </button>
          <button
            onclick="window.logout()"
            target="_self"
            class="text-white px-4 py-2 rounded-full bg-green-800 border border-green-700 hover:bg-orange-400 hover:cursor-pointer transition"
          >
            Cerrar Sesion
          </button>
          <button
            onclick="window.electronAPI.closeApp()"
            class="text-white px-4 py-2 rounded-full bg-green-800 border border-green-700 hover:bg-orange-400 hover:cursor-pointer transition"
          >
            Salir
          </button>
        </div>
      </div>

      <!--Pop up de settings-->
      <div id="settings-modal" class="absolute right-21 top-20 hidden">
        <div class="bg-zinc-400 rounded-xl flex flex-col gap-2 p-2 text-xl">
          <button
            onclick=""
            class="text-white px-4 py-2 rounded-full bg-green-800 border border-green-700 hover:bg-orange-400 hover:cursor-pointer transition"
          >
            Generar Reporte
          </button>
          <button
            onclick=""
            target="_self"
            class="text-white px-4 py-2 rounded-full bg-green-800 border border-green-700 hover:bg-orange-400 hover:cursor-pointer transition"
          >
            Cambiar Contraseña
          </button>
        </div>
      </div>
    </main>
  </body>
  <script src="../libs/sweetalert2.all.min.js"></script>
</html>
